<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warren menu bar popover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width:960px;height:680px;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 20% 110%,#1d4d46 0%,transparent 60%),radial-gradient(700px 500px at 90% -10%,#2b3a74 0%,transparent 60%),#0d1013;color:#e8eaed">
  <!-- macOS menu bar -->
  <div style="height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(10,12,14,.55);font-size:13px;color:#f1f3f5">
    <div style="display:flex;gap:18px;align-items:center"><strong style="font-weight:600">Finder</strong><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span></div>
    <div style="display:flex;gap:14px;align-items:center">
      <span style="display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Warren"><path d="M4 21V12a8 8 0 0 1 16 0v9"/><path d="M9 21v-5a3 3 0 0 1 6 0v5"/></svg>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f1f3f5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="#f1f3f5"/></svg>
      <span>Thu 15 Oct&nbsp;&nbsp;9:41</span>
    </div>
  </div>

  <!-- Popover -->
  <div style="position:absolute;top:34px;right:96px;width:392px;border-radius:16px;background:rgba(24,27,32,.94);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.6);overflow:hidden">
    <!-- header -->
    <div style="display:flex;align-items:center;gap:10px;padding:14px 16px 12px">
      <div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#7bf0b8,#2fbf8a);display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06281b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V12a8 8 0 0 1 16 0v9"/><path d="M9 21v-5a3 3 0 0 1 6 0v5"/></svg>
      </div>
      <div style="flex-grow:1">
        <div style="font-size:14px;font-weight:600;letter-spacing:-.01em">Warren</div>
        <div style="font-size:12px;color:#8f96a1;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#5ee6a8"></span>4 sites · 3 services running</div>
      </div>
      <button aria-label="Pause everything" style="width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#c9ced6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button aria-label="Settings" style="width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#c9ced6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>

    <!-- Sites -->
    <div style="padding:2px 8px 6px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7d848f"><span>Sites</span><span style="text-transform:none;letter-spacing:0;color:#5ee6a8;font-weight:500">+ New site</span></div>
      <sc-for list="{{sites}}" as="s" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px">
          <span style="width:8px;height:8px;border-radius:50%;flex:none;background:{{s.dot}}"></span>
          <div style="flex-grow:1;min-width:0">
            <div style="display:flex;align-items:center;gap:7px"><span style="font-size:13px;font-weight:500">{{s.domain}}</span><span style="font-size:10.5px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:#b5bbc5">{{s.stack}}</span></div>
            <div style="font-size:11.5px;color:#8f96a1;font-family:ui-monospace,'SF Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.meta}}</div>
          </div>
          <sc-if value="{{s.relay}}" hint-placeholder-val="{{ true }}"><span style="font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(106,169,255,.16);color:#8dbcff;font-weight:500">Relay on</span></sc-if>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8f96a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </div>
      </sc-for>
    </div>

    <div style="height:1px;background:rgba(255,255,255,.07);margin:0 16px"></div>

    <!-- Services -->
    <div style="padding:8px 16px 12px">
      <div style="padding:4px 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7d848f">Services</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        <sc-for list="{{services}}" as="v" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)">
            <div style="flex-grow:1;min-width:0"><div style="font-size:12.5px;font-weight:500">{{v.name}}</div><div style="font-size:11px;color:#8f96a1;font-family:ui-monospace,'SF Mono',monospace">{{v.port}}</div></div>
            <div style="width:30px;height:18px;border-radius:999px;position:relative;background:{{v.track}}"><div style="position:absolute;top:2px;left:{{v.knob}};width:14px;height:14px;border-radius:50%;background:#fff"></div></div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="height:1px;background:rgba(255,255,255,.07);margin:0 16px"></div>

    <!-- Runtimes -->
    <div style="padding:10px 16px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      <span style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7d848f;margin-right:4px">Active</span>
      <sc-for list="{{runtimes}}" as="r" hint-placeholder-count="4">
        <span style="font-size:12px;padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:#d6dae0">{{r}}</span>
      </sc-for>
    </div>

    <!-- Update + agent status -->
    <div style="margin:0 12px 10px;padding:10px 12px;border-radius:10px;background:rgba(245,184,75,.1);border:1px solid rgba(245,184,75,.22);display:flex;align-items:center;gap:10px">
      <div style="flex-grow:1"><div style="font-size:12.5px;font-weight:500;color:#f6c667">Warren 0.4.2 is ready</div><div style="font-size:11.5px;color:#b9a77a">12 MB delta · restarts in 3 seconds</div></div>
      <button style="font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:none;background:#f5b84b;color:#2a1c00;cursor:pointer">Update</button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#8f96a1">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#5ee6a8"></span>Claude Code connected via MCP</span>
      <span style="color:#d6dae0;font-weight:500">Open Warren ⌘O</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const on = '#5ee6a8', off = '#5c636e';
    return {
      sites: [
        { domain: 'acme.test', stack: 'Next.js', meta: ':3000 · Node 22', dot: on, relay: true },
        { domain: 'api.acme.test', stack: 'Hono', meta: ':8787 · Bun 1.2', dot: on, relay: false },
        { domain: 'docs.dev', stack: 'SvelteKit', meta: 'stopped · Node 22', dot: off, relay: false },
        { domain: 'billing.test', stack: 'Laravel', meta: 'php-fpm · PHP 8.4', dot: on, relay: false }
      ],
      services: [
        { name: 'PostgreSQL 17', port: ':5432', track: on, knob: '14px' },
        { name: 'Redis 7', port: ':6379', track: on, knob: '14px' },
        { name: 'Mailpit', port: ':8025', track: on, knob: '14px' },
        { name: 'MinIO', port: ':9000', track: off, knob: '2px' }
      ],
      runtimes: ['Node 22.11', 'PHP 8.4', 'Python 3.13', 'Bun 1.2']
    };
  }
}
</script>
</body>
</html>
